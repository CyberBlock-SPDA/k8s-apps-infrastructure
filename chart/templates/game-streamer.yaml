apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-streamer
  labels:
    {{- include "k8s-apps-infrastructure.labels" . | nindent 4 }}
    app.kubernetes.io/name: game-streamer
spec:
  replicas: {{ .Values.gameStreamer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: game-streamer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-streamer
    spec:
      containers:
        - name: game-streamer
          image: "{{ .Values.gameStreamer.image.repository }}:{{ .Values.gameStreamer.image.tag }}"
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: game-streamer
  labels:
    {{- include "k8s-apps-infrastructure.labels" . | nindent 4 }}
    app.kubernetes.io/name: game-streamer
spec:
  selector:
    app.kubernetes.io/name: game-streamer
  ports:
    - name: http
      port: 8080
      targetPort: http
