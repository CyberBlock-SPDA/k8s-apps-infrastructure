apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-web
  labels:
    {{- include "k8s-apps-infrastructure.labels" . | nindent 4 }}
    app.kubernetes.io/name: client-web
spec:
  replicas: {{ .Values.clientWeb.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: client-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client-web
    spec:
      containers:
        - name: client-web
          image: "{{ .Values.clientWeb.image.repository }}:{{ .Values.clientWeb.image.tag }}"
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: client-web
  labels:
    {{- include "k8s-apps-infrastructure.labels" . | nindent 4 }}
    app.kubernetes.io/name: client-web
spec:
  selector:
    app.kubernetes.io/name: client-web
  ports:
    - name: http
      port: 8080
      targetPort: http
